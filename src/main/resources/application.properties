server:
  port: ${PORT:8081}
  tomcat:
    threads:
      max: 50 

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mpesa_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgrespassword}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: MpesaHikariPool
      maximum-pool-size: 10 
      minimum-idle: 10
      connection-timeout: 2000 
      idle-timeout: 600000
      max-lifetime: 1740000
      connection-test-query: SELECT 1

  jpa:
    open-in-view: false 
    hibernate:
      ddl-auto: validate 
    properties:
        default_schema: public
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [traceId=%X{traceId}] %-5level %logger{36} - %msg%n"
  level:
    com.fintech.ledger: INFO