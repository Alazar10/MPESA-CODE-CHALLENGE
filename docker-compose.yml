version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mpesa-postgres
    environment:
      POSTGRES_DB: mpesa_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mpesa_db"]
      interval: 2s
      timeout: 2s
      retries: 10

volumes:
  pgdata: